name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Project with Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "ERROR: index.html is missing from the root folder!"
            exit 1
          fi
          echo '{"name": "habit-pulse-wrapper", "version": "1.0.0"}' > package.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Habit Pulse" "com.amrit.habitpulse" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitPulse-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
